// ⚠️ แก้ไขตรงนี้: ใส่ URL ที่ได้จาก Google Apps Script (Deploy > Web App)
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb04M5oRVY7bOkxBDVpFHF3UxS7FipjNvoQrTh3sxsQO-SAz7Kpd3fpv0Od05EolMRag/exec";

// จำลองระบบ google.script.run ให้ทำงานผ่าน Fetch บน Netlify ได้
const google = {
  script: {
    run: {
      withSuccessHandler: function(callback) {
        this.successHandler = callback;
        return this;
      },
      withFailureHandler: function(callback) {
        this.failureHandler = callback;
        return this;
      },
      // ฟังก์ชันเรียกเซิร์ฟเวอร์แบบใหม่
      __call: async function(action, args) {
        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: action, args: args })
          });
          const data = await response.json();
          if (this.successHandler) this.successHandler(data);
        } catch (err) {
          if (this.failureHandler) this.failureHandler(err);
          else console.error("API Error:", err);
        }
      },
      // แมปชื่อฟังก์ชันเดิมทั้งหมด
      getEmployees: function() { this.__call('getEmployees', []); },
      saveData: function(...args) { this.__call('saveData', args); },
      getLeaveBalance: function(id) { this.__call('getLeaveBalance', [id]); },
      submitLeaveRequest: function(...args) { this.__call('submitLeaveRequest', args); },
      getPendingLeaves: function() { this.__call('getPendingLeaves', []); },
      getLeaveEvents: function() { this.__call('getLeaveEvents', []); },
      getDashboardChartData: function() { this.__call('getDashboardChartData', []); },
      getActiveEmployees: function() { this.__call('getActiveEmployees', []); },
      getEmployeesWithQuota: function() { this.__call('getEmployeesWithQuota', []); },
      addNewEmployee: function(...args) { this.__call('addNewEmployee', args); },
      updateEmployeeLeaveQuota: function(data) { this.__call('updateEmployeeLeaveQuota', [data]); },
      deleteEmployee: function(id) { this.__call('deleteEmployee', [id]); },
      approveLeaveAndCutQuota: function(id, name, token) { this.__call('approveLeaveAndCutQuota', [id, name, token]); },
      rejectLeaveRequest: function(id, reason, token) { this.__call('rejectLeaveRequest', [id, reason, token]); },
      exportDataByRange: function(s, e) { this.__call('exportDataByRange', [s, e]); },
      deleteTimeLogRange: function(s, e, t) { this.__call('deleteTimeLogRange', [s, e, t]); },
      uploadCert: function(base64, name) { this.__call('uploadCert', [base64, name]); }
    }
  }
};

// แก้ไขฟังก์ชันนี้ใน <script> ของ index.html
function loadDashboardData(forceRefresh = false) {
  if (cachedEmployeeData && !forceRefresh) {
    renderChart(cachedEmployeeData);
    updateStatsUI(cachedEmployeeData.stats); // เพิ่มการสั่งอัปเดต UI จาก Cache
    return;
  }

  google.script.run.withSuccessHandler(res => {
    cachedEmployeeData = res; 
    renderChart(res);
    updateStatsUI(res.stats); // เรียกฟังก์ชันหยอดตัวเลขและชื่อ
  }).getDashboardChartData();
}

// ฟังก์ชันใหม่สำหรับหยอดตัวเลขและชื่อคนลาวันนี้โดยเฉพาะ (เพื่อความสมบูรณ์ห้ามเพี้ยน)
function updateStatsUI(stats) {
  if (!stats) return;
  
  document.getElementById('totalLeaveCount').innerText = stats.totalLeave;
  document.getElementById('topSickLeave').innerText = stats.topSick;
  
  const todayTarget = document.getElementById('todayLeave');
  if (todayTarget) {
    let displayHtml = `<div style="font-size: 28px; font-weight: bold;">${stats.todayCount}</div>`;
    if (stats.todayCount > 0) {
      displayHtml += `<div style="font-size: 11px; color: #444; margin-top: 5px;">${stats.todayList}</div>`;
    } else {
      displayHtml += `<div style="font-size: 11px; color: #999; margin-top: 5px;">ไม่มีคนลา</div>`;
    }
    todayTarget.innerHTML = displayHtml;
  }
}

// ฟังก์ชันวาดกราฟ (แยกออกมาเพื่อให้เรียกใช้ซ้ำได้จากหลายที่)
function renderChart(res) {
  const data = res.chartData || res; // รองรับทั้งแบบ object และ array
  const ctx = document.getElementById('leaveChart').getContext('2d');
  
  if (window.myChart instanceof Chart) { window.myChart.destroy(); }

  window.myChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(item => item.name),
      datasets: [{
        label: 'รวมวันลาสะสม (วัน)',
        data: data.map(item => item.total),
        backgroundColor: 'rgba(207, 52, 52, 0.7)',
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { beginAtZero: true } }
    }
  });
}

// --- ระบบ LOGIN และ การสลับหน้า ---
const ADMIN_CODE = "admin"; // นายเปลี่ยนรหัสผู้บริหารที่นี่

function checkLogin() {
  const idInput = document.getElementById('loginIdInput');
  let id = idInput.value.trim();
  
  if (!id) return alert("กรุณากรอกรหัส");

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // --- 2. เช็คกรณีผู้บริหาร (ADMIN) ---
  if (id === ADMIN_CODE) {
    currentUser = { id: 'ADMIN', name: 'ผู้บริหาร', role: 'ADMIN' };
    managerToken = id; 

    // --- ส่วนที่เพิ่ม: สั่งให้เครื่องจำสถานะ Admin ---
    localStorage.setItem('inkform_admin_logged', 'true');
    localStorage.setItem('inkform_admin_token', id);

    idInput.value = ""; 

    document.getElementById('adminBtn').style.display = 'block';
    document.getElementById('dashBtn').style.display = 'block'; 
    
    showAdminUI(); 
    showPage('empListPage'); 
    
    loadEmployeeFullList(); 
    loadApproveList();
    if(calendar) {
      setTimeout(() => { calendar.render(); }, 300);
    }
    return; 
  }

  // --- 3. เช็คกรณีพนักงาน (USER) ---
  if (!isMobile) {
    alert("❌ ปฏิเสธการเข้าถึง: สำหรับพนักงาน กรุณาใช้งานผ่านโทรศัพท์มือถือเท่านั้น");
    idInput.value = "";
    return;
  }

  id = id.padStart(4, '0');
  const emp = employees.find(e => e[0].toString().padStart(4, '0') === id);
  
  if (emp) {
    currentUser = { 
      id: emp[0].toString().padStart(4, '0'), 
      name: emp[1], 
      dept: emp[2], 
      branch: emp[3], 
      role: 'USER' 
    };
    idInput.value = ""; 
    
    document.getElementById('adminBtn').style.display = 'none';
    document.getElementById('dashBtn').style.display = 'none';

    showUserUI(); 
    showPage('workPage'); 
    
    loadLeaveBalance(currentUser.id); 
    checkCurrentLocation();
  } else {
    alert("❌ ไม่พบรหัสพนักงาน: " + id);
  }
}

function submitNewEmployee() {
  // 0. หาปุ่มที่กด (ใช้ Event เพื่อเจาะจงปุ่มใน Modal)
  const btn = event.target;
  const idInput = document.getElementById('newEmpId');
  const id = idInput.value.trim();
  const name = document.getElementById('newEmpName').value.trim();
  
  if(!id || !name) return alert("กรุณากรอกรหัสและชื่อพนักงาน");

  // 1. เปลี่ยนสถานะปุ่มทันที เพื่อให้คุณนายรู้ว่าระบบกำลังทำงาน
  const originalBtnText = btn.innerText; // เก็บข้อความเดิมไว้ (เช่น "บันทึกข้อมูล")
  btn.disabled = true;
  btn.innerText = "⏳ กำลังบันทึก...";
  btn.style.opacity = "0.7";
  btn.style.cursor = "not-allowed";

  // เติม 0 ให้ครบ 4 หลัก (คงเดิมของคุณนาย)
  const formattedId = id.padStart(4, '0');

  const dept = document.getElementById('newEmpDept').value;
  const sick = document.getElementById('newSick').value;
  const personal = document.getElementById('newPersonal').value;
  const vacation = document.getElementById('newVacation').value;
  const absent = document.getElementById('newAbsent').value;

  // 2. ส่งข้อมูลไปที่ Code.gs
  google.script.run
    .withSuccessHandler(msg => {
      // เมื่อสำเร็จ: แจ้งเตือน, ปิด Modal, ล้างค่า
      alert(msg);
      document.getElementById('addEmpModal').style.display = 'none';
      idInput.value = ""; 
      
      // คืนค่าปุ่มให้กลับมาเหมือนเดิม
      btn.disabled = false;
      btn.innerText = originalBtnText;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
      
      loadEmployeeFullList(); // รีเฟรชตาราง
    })
    .withFailureHandler(err => {
      // เมื่อพลาด: แจ้งเตือน และคืนค่าปุ่มให้กดใหม่ได้
      alert("❌ เกิดข้อผิดพลาด: " + err);
      btn.disabled = false;
      btn.innerText = originalBtnText;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
    })
    .addNewEmployee(formattedId, name, dept, sick, personal, vacation, absent);
}

  document.getElementById('navMenu').style.display = 'flex';

function showPage(pageId) {
  // --- เกราะป้องกันชั้นที่ 2: เช็คสถานะปัจจุบันร่วมกับอุปกรณ์ ---
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (currentUser && currentUser.role === 'USER' && !isMobile) {
    alert("อุปกรณ์ไม่รองรับ: พนักงานต้องใช้งานผ่านโทรศัพท์มือถือ");
    logout(); // บังคับออกระบบทันทีถ้าพยายามใช้คอม
    return;
  }

  // 1. รายชื่อหน้าทั้งหมดที่มีในระบบ
  const allPages = ['workPage', 'historyPage', 'adminPage', 'empListPage', 'dashboardPage'];

  // 2. วนลูปเพื่อ ซ่อน/แสดง หน้าที่ต้องการ
  allPages.forEach(p => {
    const el = document.getElementById(p);
    if (el) {
      el.style.display = (p === pageId ? 'block' : 'none');
    }
  });

  // 3. เงื่อนไขพิเศษ: ถ้าเปิดหน้า "สถิติ" (Dashboard)
  if (pageId === 'dashboardPage') {
    setTimeout(() => {
      loadDashboardData(); 
    }, 200);
  }

  // 4. เงื่อนไขพิเศษ: หน้า Admin
  if (pageId === 'adminPage') {
    loadApproveList(); 
    if (calendar) {
      setTimeout(() => { calendar.render(); }, 50);
    } else {
      initCalendar();
    }
  }

  // 5. เงื่อนไขพิเศษ: หน้ารายชื่อพนักงาน
  if (pageId === 'empListPage') {
    loadEmployeeFullList();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
// ฟังก์ชัน LOGOUT แบบไม่ขาว (สลับหน้า)
function logout() {
  // --- ส่วนที่เพิ่ม: ล้างค่าความจำ Admin ในเบราว์เซอร์ ---
  localStorage.removeItem('inkform_admin_logged');
  localStorage.removeItem('inkform_admin_token');

  // 1. ล้างข้อมูลผู้ใช้ในระบบ (คงเดิมห้ามเพี้ยน)
  currentUser = null;
  managerToken = "";

  // 2. ซ่อนทุกหน้าจอที่มี (รวมถึงหน้า Dashboard และเมนูที่เพิ่มใหม่)
  const allPages = ['workPage', 'historyPage', 'adminPage', 'empListPage', 'dashboardPage', 'navMenu'];
  allPages.forEach(p => {
    const el = document.getElementById(p);
    if (el) el.style.display = 'none';
  });

  // 3. ซ่อนปุ่มเมนูพิเศษ (Admin และ Dashboard) เพื่อให้ปุ่มหายไปจริง
  const specialBtns = ['adminBtn', 'dashBtn'];
  specialBtns.forEach(b => {
    const btn = document.getElementById(b);
    if (btn) btn.style.display = 'none';
  });

  // 4. ปิด Modal ทั้งหมดที่อาจเปิดค้างไว้
  const modals = ['addEmpModal', 'editLeaveModal'];
  modals.forEach(m => {
    const modal = document.getElementById(m);
    if (modal) modal.style.display = 'none';
  });

  // 5. ล้างค่าในช่อง Input ล็อกอิน
  const loginInput = document.getElementById('loginIdInput');
  if (loginInput) loginInput.value = "";

  // 6. แสดงหน้าล็อกอินกลับขึ้นมา
  document.getElementById('loginPage').style.display = 'block';
  
  // 7. ล้างข้อความในตารางพนักงาน (กันข้อมูลค้าง)
  const tbody = document.getElementById('empTableBody');
  if (tbody) tbody.innerHTML = "";

  // --- ส่วนที่แนะนำเพิ่มเติม: รีเฟรชหน้าเว็บเพื่อให้ชัวร์ว่า State ทุกอย่างสะอาด 100% ---
  // window.location.reload(); 
  
  console.log("Logout successful: All views, special menus, and local storage cleared.");
}

// ฟังก์ชันโหลดรายชื่อพนักงานพร้อมปุ่มลบ
function loadEmployeeFullList() {
  const tbody = document.getElementById('empTableBody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">กำลังโหลด...</td></tr>';
  
  google.script.run.withSuccessHandler(data => {
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">ไม่พบข้อมูล</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(emp => {
      // ตรวจสอบว่า ID เป็น 4 หลักเพื่อความสวยงามในหน้าตาราง
      const displayId = emp.id.toString().padStart(4, '0');
      
      return `
        <tr style="border-bottom: 1px solid #eee;">
          <td style="padding:10px; text-align:center;">${displayId}</td>
          <td style="padding:10px;">${emp.name}</td>
          <td style="padding:10px;">${emp.dept || '-'}</td>
          <td style="padding:10px; text-align:center; font-weight:bold; color:#1a73e8;">${emp.vacation}</td>

let retryCount = 0;

async function submitData() {
  // เช็ก currentUser แบบละเอียดขึ้นนิดนึงป้องกัน Alert เด้งมั่ว
  if (typeof currentUser === 'undefined' || !currentUser) return alert('กรุณาเข้าสู่ระบบก่อน');
  
  const btn = document.getElementById('submitBtn');
  const mode = document.getElementById('mode').value;
  const overlay = document.getElementById('loading-overlay');

  overlay.style.display = 'flex';
  btn.disabled = true; 
  btn.innerText = "⏳ กำลังบันทึก...";

  if (mode === 'leave') {
    const s = document.getElementById('leaveStart').value;
    const e = document.getElementById('leaveEnd').value;
    const type = document.getElementById('leaveType').value;
    const note = document.getElementById('leaveNote').value;
    const periodVal = document.getElementById('leavePeriod').value;
    const certInput = document.getElementById('certFile'); 

    if(!s || !e) { 
      overlay.style.display = 'none';
      btn.disabled = false; 
      btn.innerText = "บันทึกข้อมูล"; 
      return alert('กรุณาเลือกวันที่ลา'); 
    }

    if (type === 'ลาป่วย' && certInput.files.length > 0) {
      try {
        const base64 = await compressImage(certInput.files[0]);
        google.script.run
          .withSuccessHandler(url => { 
            if(url) {
              // ส่งต่อให้ saveLeaveToSheet และในนั้นต้องมี resetForm() เมื่อสำเร็จ
              saveLeaveToSheet(currentUser.id, currentUser.name, type, s, e, note, url, periodVal); 
            } else {
              throw "ไม่ได้รับ URL จากการอัปโหลด";
            }
          })
          .withFailureHandler(err => {
            overlay.style.display = 'none';
            alert("อัปโหลดไฟล์ล้มเหลว: " + err);
            btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
          })
          .uploadCert(base64, certInput.files[0].name);
      } catch (err) {
        overlay.style.display = 'none';
        alert("เกิดข้อผิดพลาดในการประมวลผลรูปภาพ: " + err);
        btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
      }
    } else {
      // กรณีลาทั่วไปที่ไม่มีใบรับรองแพทย์ หรือไม่ได้ลาป่วย
      saveLeaveToSheet(currentUser.id, currentUser.name, type, s, e, note, "", periodVal);
    }
  } else {
    // --- ส่วนของโหมดลงเวลาเข้า-ออกงาน (Work Mode) ---
    const photoInput = document.getElementById('photo');
    if(!photoInput.files.length) { 
      overlay.style.display = 'none';
      btn.disabled = false; 
      btn.innerText = "บันทึกข้อมูล"; 
      return alert('กรุณาถ่ายรูปก่อนบันทึก'); 
    }

    navigator.geolocation.getCurrentPosition(async pos => {
      const res = checkAllBranches(pos.coords.latitude, pos.coords.longitude);
      if(!res) { 
        overlay.style.display = 'none';
        btn.disabled = false; 
        btn.innerText = "บันทึกข้อมูล"; 
        return alert('❌ นอกพื้นที่ปฏิบัติงาน'); 
      }
      
      try {
        const img = await compressImage(photoInput.files[0]);
        retryCount = 0; 
        
        const attemptUpload = () => {
          google.script.run
            .withSuccessHandler(msg => { 
              overlay.style.display = 'none';
              if (msg) {
                alert(msg); 
                // บันทึกเข้างานสำเร็จ -> เคลียร์ฟอร์มแต่อยู่หน้าพนักงานคนเดิม
                if (typeof resetForm === "function") resetForm(); 
              }
              btn.disabled = false; 
              btn.innerText = "บันทึกข้อมูล"; 
            })
            .withFailureHandler(err => {
              if (retryCount < 3) {
                retryCount++;
                console.log("พยายามส่งใหม่ครั้งที่ " + retryCount);
                attemptUpload();
              } else {
                overlay.style.display = 'none';
                alert("❌ บันทึกไม่สำเร็จ: " + err);
                btn.disabled = false; 
                btn.innerText = "บันทึกข้อมูล";
              }
            })
            .saveData(currentUser.id, currentUser.name, currentUser.dept, res.branch, document.getElementById('type').value, img, pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        };
        attemptUpload();
      } catch (err) {
        overlay.style.display = 'none';
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + err);
        btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
      }
    }, (err) => { 
      overlay.style.display = 'none';
      btn.disabled = false; 
      btn.innerText = "บันทึกข้อมูล"; 
      alert("❌ GPS ขัดข้อง กรุณาเปิดตำแหน่งในมือถือ"); 
    }, { enableHighAccuracy: true });
  }
}

function checkCurrentLocation() {
  const res = document.getElementById('locationResult');
  res.innerHTML = "⏳ ตรวจสอบตำแหน่ง...";
  navigator.geolocation.getCurrentPosition(pos => {
    const result = checkAllBranches(pos.coords.latitude, pos.coords.longitude);
    if (result) { res.innerHTML = `✅ อยู่ในพื้นที่: ${result.branch}`; res.style.color = "green"; } 
    else { res.innerHTML = `❌ อยู่นอกพื้นที่`; res.style.color = "red"; }
  }, () => { res.innerHTML = "❌ GPS ขัดข้อง"; }, { enableHighAccuracy: true });
}

function checkAllBranches(lat, lng) {
  let nearest = null;
  for (const branch in LOCATION_BY_BRANCH) {
    for (const loc of LOCATION_BY_BRANCH[branch]) {
      const d = distance(lat, lng, loc.lat, loc.lng);
      if (d <= loc.radius) { if (!nearest || d < nearest.distance) nearest = { branch: branch, distance: Math.round(d) }; }
    }
  } return nearest;
}

function distance(lat1, lng1, lat2, lng2) { const R = 6371000; const dLat = (lat2-lat1) * Math.PI/180; const dLng = (lng2-lng1) * Math.PI/180; const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }

function initCalendar() {
  const calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'th',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,listMonth' // เพิ่มปุ่มดูแบบรายชื่อ
    },
    
    // เมื่อจิ้มที่ "วันที่" (Date Click)
    dateClick: function(info) {
      const allEvents = calendar.getEvents();
      // กรองเฉพาะคนลาในวันที่จิ้ม
      const dayEvents = allEvents.filter(e => {
        const eventDate = e.startStr.split('T')[0];
        return eventDate === info.dateStr;
      });

      if (dayEvents.length > 0) {
        let msg = "📅 รายชื่อคนลาวันที่ " + info.dateStr + ":\n";
        msg += "------------------------------\n";
        dayEvents.forEach((ev, index) => {
          // ดึงประเภทการลาจาก extendedProps (ต้องแก้ที่ Code.gs ด้วย)
          const type = ev.extendedProps.type || "รายการลา";
          msg += `${index + 1}. ${ev.title} (${type})\n`;
        });
        alert(msg);
      } else {
        alert("✅ วันที่ " + info.dateStr + " ไม่มีคนลาครับ");
      }
    },

    // เมื่อจิ้มที่ "ตัวเหตุการณ์" (Event Click)
    eventClick: function(info) {
      alert("พนักงาน: " + info.event.title + "\nประเภท: " + info.event.extendedProps.type);
    },

    events: (info, success) => google.script.run.withSuccessHandler(success).getLeaveEvents()
  });
  calendar.render();
}

    }).join(''); 

  }).getActiveEmployees(); 
}

async function compressImage(file) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = e => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        // ปรับจาก 1024 เป็น 800 เพื่อความเร็วสูงสุดสำหรับคนเน็ตช้า
        const maxLimit = 400; 
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxLimit) {
            height *= maxLimit / width;
            width = maxLimit;
          }
        } else {
          if (height > maxLimit) {
            width *= maxLimit / height;
            height = maxLimit;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        
        // ปรับคุณภาพเหลือ 0.5 (ลดขนาดไฟล์ได้มหาศาล แต่ยังมองเห็นหน้าชัดเจน)
        res(canvas.toDataURL('image/jpeg', 0.5)); 
      };
    };
  });
}

function downloadRangeTXT() {
  const start = document.getElementById('exportStart').value;
  const end = document.getElementById('exportEnd').value;
  
  if (!start || !end) return alert("เลือกช่วงวันที่ก่อน");

  google.script.run.withSuccessHandler(data => {
    if (!data.length) return alert("ไม่พบข้อมูลในช่วงวันที่เลือก");

    // แก้ไขส่วน map เพื่อบังคับรหัสพนักงานเป็น 4 หลัก
    const txt = data.map(item => {
      // แปลง ID เป็น String และเติม 0 ข้างหน้าให้ครบ 4 หลักเสมอ
      const formattedId = item.empId.toString().padStart(4, '0'); 
      return `${formattedId}\t${item.date} ${item.time}`;
    }).join("\r\n");

    // สร้างไฟล์ TXT สำหรับดาวน์โหลด
    const blob = new Blob([txt], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    
    a.href = url;
    a.download = `Report_${start}_to_${end}.txt`; // ตั้งชื่อไฟล์ให้ชัดเจนว่าถึงวันที่เท่าไหร่
    document.body.appendChild(a); // เพิ่มลงใน Body ชั่วคราวเพื่อให้เบราว์เซอร์บางตัวทำงานได้แม่นยำขึ้น
    a.click();
    document.body.removeChild(a); // ลบทิ้งหลังจากคลิกแล้ว
    URL.revokeObjectURL(url); // คืนหน่วยความจำ
  }).exportDataByRange(start, end);
}

function downloadSummaryExcel() {
  const btn = event.target;
  btn.disabled = true;
  btn.innerText = "⏳ กำลังสร้างไฟล์...";

  google.script.run.withSuccessHandler(data => {
    if (!data || data.length === 0) {
      alert("ไม่พบข้อมูลใน LeaveSummary");
      btn.disabled = false;
      btn.innerText = "📥 ดาวน์โหลด Excel (สรุปวันลา)";
      return;
    }

    // สร้าง Header ตามชีท LeaveSummary (A-F)
    let csvContent = "\uFEFF"; // กันภาษาไทยเพี้ยน
    csvContent += "รหัสพนักงาน,ชื่อ-นามสกุล,ขาดงาน (วัน),ลากิจ (วัน),ลาป่วย (วัน),ลาพักร้อน (วัน)\n";

    // วนลูปจากข้อมูลที่ดึงมาจากชีทโดยตรง
    data.forEach((row, index) => {
      if (index === 0) return; // ข้ามหัวตารางจากชีท
      
      const empId = `'${row[0]}`; // รหัสพนักงาน
      const name = `"${row[1]}"`; // ชื่อ
      const absent = row[2] || 0; // ขาด
      const personal = row[3] || 0; // กิจ
      const sick = row[4] || 0; // ป่วย
      const vacation = row[5] || 0; // พักร้อน
      
      csvContent += [empId, name, absent, personal, sick, vacation].join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `สรุปวันลาพนักงาน_${new Date().toLocaleDateString('th-TH')}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    btn.disabled = false;
    btn.innerText = "📥 ดาวน์โหลด Excel (สรุปวันลา)";
  }).getRawLeaveSummary(); // ต้องไปเพิ่มฟังก์ชันนี้ใน Code.gs
}

      let html = `<div style="font-size: 28px; font-weight: bold;">${res.stats.todayCount}</div>`;
      if (res.stats.todayCount > 0) {
        html += `<div style="font-size: 11px; margin-top: 5px; color: #444;">${res.stats.todayList}</div>`;
      } else {
        html += `<div style="font-size: 11px; color: #999; margin-top: 5px;">ไม่มีคนลา</div>`;
      }
      target.innerHTML = html;
    }

    // ส่วนวาดกราฟ (คงเดิมห้ามเพี้ยน)
    const ctx = document.getElementById('leaveChart').getContext('2d');
    if (window.myChart instanceof Chart) { window.myChart.destroy(); }
    window.myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: res.chartData.map(item => item.name),
        datasets: [{
          label: 'รวมวันลาสะสม (วัน)',
          data: res.chartData.map(item => item.total),
          backgroundColor: 'rgba(207, 52, 52, 0.7)',
          borderRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
      }
    });
  }).getDashboardChartData();
}

function confirmDeleteRange() {
  const start = document.getElementById('deleteStart').value;
  const end = document.getElementById('deleteEnd').value;
  
  if (!start || !end) return alert("กรุณาเลือกช่วงวันที่ต้องการลบด้วยครับ");

  // แปลงวันที่ให้คุณนายอ่านง่ายขึ้นก่อนลบ
  const sD = new Date(start).toLocaleDateString('th-TH');
  const eD = new Date(end).toLocaleDateString('th-TH');
  
  const msg = `‼️ คำเตือน: ข้อมูลการลงเวลาตั้งแต่วันที่ ${sD} ถึง ${eD}\nจะถูกลบออกจาก Sheet "TimeLog" ถาวร\n\nยืนยันที่จะลบใช่ไหมครับ?`;

  if (confirm(msg)) {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.style.display = 'flex';
    
    // ใช้รหัสผ่านที่ใช้ Login มา (managerToken)
    const token = (typeof managerToken !== 'undefined' && managerToken) ? managerToken : ADMIN_CODE;

    google.script.run.withSuccessHandler(res => {
      if (overlay) overlay.style.display = 'none';
      alert(res);
      document.getElementById('deleteStart').value = "";
      document.getElementById('deleteEnd').value = "";
    }).deleteTimeLogRange(start, end, token);
  }
}
